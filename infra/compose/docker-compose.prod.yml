# Cap json-file logs so a chatty service cannot fill the VPS disk. This is
# also enforced daemon-wide in setup-server.sh (covering containers that do not
# inherit this anchor), but keeping it here documents the intent per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Shared shape of every NestJS service in production. A service block only
# adds its name-specific bits: image, env_file and labels. The
# prometheus.scrape label opts the container into Prometheus discovery.
x-nestjs-service: &nestjs-service
  restart: unless-stopped
  logging: *default-logging
  # Cap memory so one runaway service can't OOM a small single-box VPS.
  mem_limit: 512m
  networks:
    - backend
  healthcheck:
    # Gate on readiness, not liveness: /api/v1 returns ok unconditionally,
    # while /api/v1/ready is 503 until subsystems (e.g. the Kafka consumer
    # group join) are actually up, so `up -d --wait` and the deploy gate wait
    # for a service that can really do work. start_period allows for the group
    # rebalance after an ungraceful restart.
    test:
      [
        'CMD-SHELL',
        'node -e "require(\"http\").get(\"http://localhost:3000/api/v1/ready\", r => process.exit(r.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))"',
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  depends_on:
    kafka:
      condition: service_healthy
    mongodb:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ==========================================================================
  # APP SERVICES
  # ==========================================================================

  service-1:
    <<: *nestjs-service
    image: ${DOCKER_REGISTRY}/forgestack-service-1:v6
    env_file:
      - ../env/service-1.env.prod
    labels:
      - 'service=service-1'
      - 'environment=production'
      - 'prometheus.scrape=true'

  service-2:
    <<: *nestjs-service
    image: ${DOCKER_REGISTRY}/forgestack-service-2:v5
    env_file:
      - ../env/service-2.env.prod
    labels:
      - 'service=service-2'
      - 'environment=production'
      - 'prometheus.scrape=true'

  public-page:
    image: ${DOCKER_REGISTRY}/forgestack-public-page:v11
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - ../env/public-page.env.prod
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - service-1

  # ==========================================================================
  # REVERSE PROXY
  # ==========================================================================

  caddy:
    image: ${DOCKER_REGISTRY}/forgestack-caddy:v4
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - '80:80'
      - '443:443'
    # Only the variables Caddy needs, interpolated from compose/.env.
    # infra.env.prod also holds registry and DB credentials that must not
    # end up inside the proxy container.
    environment:
      - DOMAIN=${DOMAIN}
      - PROTOCOL=${PROTOCOL:-https}
      - TLS_ENV=${TLS_ENV:-prod}
      - CADDY_BASIC_AUTH_USER=${CADDY_BASIC_AUTH_USER:-admin}
      - CADDY_BASIC_AUTH_HASH=${CADDY_BASIC_AUTH_HASH}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Extra sites served by this same Caddy: drop *.caddy site blocks into
      # <REMOTE_PATH>/compose/caddy-extra/ on the server (the Caddyfile imports
      # /etc/caddy/extra/*.caddy). Empty by default; deploys never touch it.
      - ./caddy-extra:/etc/caddy/extra:ro
    networks:
      - backend
    healthcheck:
      # `caddy version` only proves the binary runs. Hit the admin API instead,
      # which is only up once Caddy has loaded its config and is serving. Use
      # 127.0.0.1, not localhost: the admin API binds IPv4 loopback only, and
      # localhost resolves to ::1 first inside the Alpine image.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - public-page
      - service-1
      - service-2
      - grafana

  # ==========================================================================
  # DATA STORES
  # ==========================================================================

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    mem_limit: 768m
    command: ['bash', '/scripts/mongo-startup.sh']
    environment:
      - MONGO_ADMIN_USER=${MONGO_ADMIN_USER:-admin}
      - MONGO_ADMIN_PASS=${MONGO_ADMIN_PASS}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ../mongo/mongo-startup.sh:/scripts/mongo-startup.sh:ro
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh -u $$MONGO_ADMIN_USER -p $$MONGO_ADMIN_PASS --authenticationDatabase admin --eval "rs.status().ok" | grep -q 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s

  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    mem_limit: 384m
    # Pass the password through the container's own environment and read it
    # inside a shell so compose does not interpolate it into the container's
    # command/args, where `docker inspect` would expose it in plaintext.
    # REDISCLI_AUTH is the auth env var redis-cli reads, so the healthcheck
    # needs no -a flag either.
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    entrypoint: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  # ==========================================================================
  # MESSAGE BROKER
  # ==========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Faster session timeout for quicker cleanup of stale broker nodes
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_MAX_SESSION_TIMEOUT: 10000
      # Enable 4LW commands for healthcheck
      KAFKA_OPTS: '-Dzookeeper.4lw.commands.whitelist=ruok,srvr'
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'echo ruok | nc localhost 2181 | grep imok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      # Shorter session timeout - broker node expires faster on restart
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 6000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 6000
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s

  # ==========================================================================
  # MONITORING
  # ==========================================================================

  prometheus:
    image: ${DOCKER_REGISTRY}/forgestack-prometheus:v4
    restart: unless-stopped
    mem_limit: 512m
    # Root so docker_sd_configs can read the Docker socket (the image's
    # default user, nobody, gets permission denied).
    user: root
    # Overriding command drops the image defaults, so the config path is
    # repeated. --web.enable-remote-write-receiver lets Tempo's
    # metrics_generator remote_write into Prometheus; without it those writes
    # are silently rejected. Retention is pinned explicitly.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-lifecycle'
    volumes:
      - prometheus_data:/prometheus
      # Secret mounted at runtime instead of baked into the pushed image.
      # deploy.sh stages it to <remote>/monitoring/prometheus/.
      - ../monitoring/prometheus/internal-api-key:/etc/prometheus/internal-api-key:ro
      # Read-only Docker socket for docker_sd_configs: services are discovered
      # by their prometheus.scrape=true container label.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - cadvisor
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  grafana:
    image: ${DOCKER_REGISTRY}/forgestack-grafana:v4
    restart: unless-stopped
    mem_limit: 384m
    # No env_file on purpose: everything Grafana needs is listed below,
    # interpolated from compose/.env.
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
      - GF_SERVER_DOMAIN=grafana.${DOMAIN}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    privileged: true
    restart: unless-stopped
    mem_limit: 256m
    command:
      - '--housekeeping_interval=15s'
      - '--disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl'
      - '--containerd=/run/containerd/containerd.sock'
      - '--containerd-namespace=moby'
    volumes:
      - /:/rootfs:ro
      # ro like dev: cAdvisor only reads the docker socket and runtime state.
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /run/containerd:/run/containerd:ro
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tempo:
    image: ${DOCKER_REGISTRY}/forgestack-tempo:v4
    restart: unless-stopped
    mem_limit: 384m
    user: '0:0'
    volumes:
      - tempo_data:/tmp/tempo
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3200/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  loki:
    image: ${DOCKER_REGISTRY}/forgestack-loki:v4
    restart: unless-stopped
    mem_limit: 384m
    volumes:
      - loki_data:/loki
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  promtail:
    image: ${DOCKER_REGISTRY}/forgestack-promtail:v4
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      # Read-only: promtail only reads container logs, never writes.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persist the positions file so restarts do not re-ingest all logs.
      - promtail_data:/promtail
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9080/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - loki

  # ==========================================================================
  # DEV TOOLS
  # ==========================================================================

  portainer:
    image: portainer/portainer-ce:2.39.4
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - backend

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  backend:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  # Data stores
  mongodb_data:
  mongodb_config:
  redis_data:
  # Message broker
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  # Monitoring
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  promtail_data:
  # Reverse proxy
  caddy_data:
  caddy_config:
  # Dev tools
  portainer_data:

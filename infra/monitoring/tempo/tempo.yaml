server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal

compactor:
  compaction:
    # Delete trace blocks older than this so local storage does not grow
    # without bound.
    block_retention: 48h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

# The metrics_generator only runs for tenants that enable its processors. This
# turns on span/service-graph metrics by default (they remote_write into
# Prometheus, which now has --web.enable-remote-write-receiver).
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

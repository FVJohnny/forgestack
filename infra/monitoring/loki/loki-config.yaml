auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# The ruler needs an Alertmanager to send to. There is none in this stack yet
# (see the note in prometheus/prometheus.yml), and `localhost:9093` inside the
# Loki container points at nothing, so the ruler is left unconfigured. Wire it
# to the same Alertmanager as Prometheus when you add one.
# ruler:
#   alertmanager_url: http://alertmanager:9093

limits_config:
  max_streams_per_user: 50000
  max_global_streams_per_user: 50000
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  # Explicit retention window (the compactor below enforces deletion). Without
  # this, logs are kept indefinitely and fill the disk.
  retention_period: 168h # 7 days

# Reduce retention to save space
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

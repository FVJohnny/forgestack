server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Persisted so promtail resumes where it left off instead of re-reading every
# container log from the start on each restart (which duplicated ingestion).
# The compose files mount a volume at /promtail.
positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_environment']
        target_label: 'environment'
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            context: context
            service: service
            environment: environment
            hostname: hostname
            traceId: traceId
            spanId: spanId
      # Copy service to service_name for consistency
      - template:
          source: service_name
          template: '{{ .service }}'
      - labels:
          level:
          service:
          service_name:
          environment:
      - timestamp:
          source: timestamp
          format: RFC3339
      # Show just the message in log line (metadata is in labels)
      - output:
          source: message

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks that need no databases: lint, typecheck, build.
  static:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # public-page is excluded from the npm workspaces and installs via pnpm,
      # but Nx runs its lint/typecheck/build/test targets in every run-many.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/public-page/package.json

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/public-page

      - name: Lint
        run: npm run lint

      - name: Test custom ESLint rules
        run: npm run test:eslint-rules

      - name: Typecheck
        run: npm run typecheck

      - name: Check locale key parity
        run: npm --prefix frontend/public-page run check:locales

      - name: Build
        run: npm run build

  # Cheap validation of everything the deploy path depends on: compose
  # interpolation, shell syntax, alert rules, and the Caddyfile. Without this,
  # a broken compose file or alert rule is first discovered mid-deploy.
  infra:
    name: Infra validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The env files are gitignored; stand-ins from the committed examples
      # are enough for interpolation and env_file resolution.
      - name: Create env files from examples
        run: |
          for f in infra/env/*.example; do cp "$f" "${f%.example}"; done
          for d in backend/services/*/; do
            if [ -f "$d.env.example" ]; then cp "$d.env.example" "$d.env"; fi
          done
          cp frontend/public-page/.env.local.example frontend/public-page/.env.local
          cp infra/monitoring/prometheus/internal-api-key.example infra/monitoring/prometheus/internal-api-key

      - name: Validate compose files
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml config -q
          docker compose -f infra/compose/docker-compose.prod.yml --env-file infra/env/infra.env.prod config -q

      - name: Check shell script syntax
        run: bash -n infra/scripts/*.sh infra/mongo/mongo-startup.sh scripts/*.sh

      - name: Check Prometheus alert rules
        run: >
          docker run --rm -v "$PWD/infra/monitoring/prometheus:/cfg:ro"
          --entrypoint promtool prom/prometheus:v2.54.1 check rules /cfg/alert-rules.yml

      - name: Validate Caddyfile
        run: >
          docker run --rm
          -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          -v "$PWD/infra/caddy/dev-only:/etc/caddy/extra:ro"
          caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # The mongodb/redis lib tests hit real datastores, so stand them up first.
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # public-page installs via pnpm; its vitest suite runs in the run-many below.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/public-page/package.json

      # A single-node replica set with auth, matching the URI the tests use:
      # mongodb://admin:password@localhost:27017/...?replicaSet=rs0&directConnection=true
      # A keyfile is mandatory when auth is enabled together with --replSet.
      - name: Start MongoDB (replica set + auth)
        run: |
          openssl rand -base64 756 > "$RUNNER_TEMP/mongo-keyfile"
          chmod 400 "$RUNNER_TEMP/mongo-keyfile"
          # mongod runs as uid 999 in the image; make the mounted keyfile owned by it.
          sudo chown 999:999 "$RUNNER_TEMP/mongo-keyfile"
          docker run -d --name mongo -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=admin \
            -e MONGO_INITDB_ROOT_PASSWORD=password \
            -v "$RUNNER_TEMP/mongo-keyfile:/etc/mongo-keyfile:ro" \
            mongo:7.0 --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile
          echo "Waiting for mongod to accept connections..."
          for i in $(seq 1 30); do
            if docker exec mongo mongosh -u admin -p password --authenticationDatabase admin --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          echo "Initiating replica set..."
          docker exec mongo mongosh -u admin -p password --authenticationDatabase admin --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          echo "Waiting for primary..."
          for i in $(seq 1 30); do
            if docker exec mongo mongosh -u admin -p password --authenticationDatabase admin --quiet --eval 'rs.status().members[0].stateStr' 2>/dev/null | grep -q PRIMARY; then
              break
            fi
            sleep 2
          done

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/public-page

      - name: Test
        # --coverage so the per-project coverageThreshold (the item-61 floor)
        # is enforced in CI, not just locally.
        run: npm run test -- --skip-nx-cache --coverage
        env:
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
